# Remote Desktop Web — static files + WebSocket proxy to Python relay (port 8080)
# Deployed by: deploy-vps.sh / deploy-chain-vps1.sh
#
# OPSEC: direct IP access redirects to a neutral site.
# Web panel is only available at the secret path defined below.
# Change PANEL_PATH to a hard-to-guess slug before deploying.
#
# PANEL_PATH = /panel
# To change:  sed -i 's|/panel|/your-secret-slug|g' nginx-remote-desktop.conf

# ── HTTP: return 404 (reveals nothing) ────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl-remote-desktop/cert.pem;
    ssl_certificate_key /etc/nginx/ssl-remote-desktop/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/remote-desktop;

    # WebSocket upgrade map
    # (defined globally in nginx.conf — referenced here)

    # ── 1. Bare root / index.html → 404 ──────────────────────────────────────
    location = / {
        return 404;
    }
    location = /index.html {
        return 404;
    }

    # ── 2. Secret web panel ────────────────────────────────────────────────────
    # Access: https://<vps-ip>/panel/
    # Change "panel" to a hard-to-guess string for better OPSEC.
    location = /panel {
        return 301 /panel/;
    }
    location ^~ /panel/ {
        # Serve index.html from web root (assets load from / below)
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── 3. WebSocket: client ───────────────────────────────────────────────────
    location /client {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
    }

    # ── 4. WebSocket: host ─────────────────────────────────────────────────────
    location /host {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
    }

    # ── 5. WebSocket: admin dashboard ─────────────────────────────────────────
    location /admin {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_read_timeout 86400;
    }

    # ── 6. Static assets (CSS, JS, images, fonts) ─────────────────────────────
    # index.html references these with relative/absolute paths.
    # Served silently; directory listing is off; no fallback to index.html.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
